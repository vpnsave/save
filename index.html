<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save — Быстрый доступ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 36px 24px 28px;
            border-radius: 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2c2c2c;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        h2 {
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 16px 0;
            color: #ffcc00;
        }
        p {
            font-size: 15px;
            color: #b0b0b0;
            margin: 0 0 28px 0;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background-color: #ffcc00;
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #e6b800;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #2c2c2c;
            font-size: 11px;
            color: #6e6e6e;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Доступ к сервису Save</h1>
        <h2>Спасибо за переход!</h2>
        <p>Нажмите на кнопку ниже, чтобы открыть официальный бот в Telegram и активировать +1 месяц доступа.</p>
        <a href="https://t.me/vpnsave" class="btn">Открыть ✈️</a>
        
        <div class="footer">
            © 2026 Save. Все права защищены.<br>
            Используя сервис, вы соглашаетесь с правилами использования и политикой конфиденциальности.
        </div>
    </div>
</


body>
</html>
